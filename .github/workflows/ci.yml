name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Run the PHP job with code coverage (xdebug)'
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: artisan test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, fileinfo, bcmath, zip, gd, sqlite3, pdo_sqlite, curl, openssl
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # These directories are gitignored, so a fresh checkout lacks them and
      # composer's post-autoload-dump (`artisan package:discover`) would abort
      # with "Please provide a valid cache path."
      - name: Create writable directories
        run: |
          mkdir -p bootstrap/cache storage/app storage/framework/cache/data \
            storage/framework/sessions storage/framework/views storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml drives the test environment: sqlite :memory:, array cache/sessions,
      # sync queue and VERTEX_INSTALLED=true, so no database service is needed.
      - name: Run tests
        run: php artisan test

      # Experimental: collects a text coverage report and encodes the outcome in the
      # artifact name so the result is readable from the API without job logs.
      - name: Coverage diagnostics
        id: cov
        continue-on-error: true
        run: |
          set +e
          php -d memory_limit=-1 -d xdebug.mode=coverage vendor/bin/phpunit --coverage-text > coverage.txt 2>&1
          status=$?
          pct=$(grep -oE '[0-9]+([.][0-9]+)?%' coverage.txt | tail -1)
          msg=$(grep -iE 'error|exception|fatal|failed|warning' coverage.txt | tail -2 | tr -d '\r' | tr '\n' '|' | tr -c 'A-Za-z0-9.,=_-|' '_' | cut -c1-150)
          echo "status=$status pct=${pct:-none}"
          tail -5 coverage.txt
          {
            echo "pct=$status-${pct:-none}-${msg:-none}"
          } >> "$GITHUB_OUTPUT"
          exit 0
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-${{ steps.cov.outputs.pct }}
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 3

  frontend-build:
    name: npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
