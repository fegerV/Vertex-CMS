name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: artisan test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, fileinfo, bcmath, zip, gd, sqlite3, pdo_sqlite, curl, openssl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # These directories are gitignored, so a fresh checkout lacks them and
      # composer's post-autoload-dump (`artisan package:discover`) would abort
      # with "Please provide a valid cache path."
      - name: Create writable directories
        run: |
          mkdir -p bootstrap/cache storage/app storage/framework/cache/data \
            storage/framework/sessions storage/framework/views storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml drives the test environment: sqlite :memory:, array cache/sessions,
      # sync queue and VERTEX_INSTALLED=true, so no database service is needed.
      - name: Run tests
        run: php artisan test

  frontend-build:
    name: npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
