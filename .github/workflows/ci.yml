name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: artisan test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, fileinfo, bcmath, zip, gd, sqlite3, pdo_sqlite, curl, openssl
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # These directories are gitignored, so a fresh checkout lacks them and
      # composer's post-autoload-dump (`artisan package:discover`) would abort
      # with "Please provide a valid cache path."
      - name: Create writable directories
        run: |
          mkdir -p bootstrap/cache storage/app storage/framework/cache/data \
            storage/framework/sessions storage/framework/views storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml drives the test environment: sqlite :memory:, array cache/sessions,
      # sync queue and VERTEX_INSTALLED=true, so no database service is needed.
      - name: Run tests
        run: php artisan test

      # `artisan test` cannot emit clover, so coverage is collected in a second
      # pass. The report is summarised and enforced by scripts/ci/coverage-check.php;
      # the percentage also lands in the artifact name and the job summary.
      - name: Collect coverage
        id: cov
        run: |
          set +e
          php -d memory_limit=-1 -d xdebug.mode=coverage vendor/bin/phpunit \
            --coverage-clover=coverage.xml > coverage.txt 2>&1
          tests_status=$?
          tail -5 coverage.txt

          php scripts/ci/coverage-check.php coverage.xml "$COVERAGE_MIN" > coverage-summary.txt
          coverage_status=$?
          cat coverage-summary.txt

          pct=$(tail -1 coverage-summary.txt)
          echo "pct=${pct:-none}" >> "$GITHUB_OUTPUT"
          {
            echo "### Code coverage"
            echo ""
            echo '```'
            head -1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $tests_status -ne 0 ] || [ $coverage_status -ne 0 ]; then
            exit 1
          fi
        env:
          COVERAGE_MIN: '45'
          XDEBUG_MODE: coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.cov.outputs.pct }}
          path: |
            coverage.xml
            coverage.txt
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
