name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Run the PHP job with code coverage (xdebug)'
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: artisan test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, fileinfo, bcmath, zip, gd, sqlite3, pdo_sqlite, curl, openssl
          coverage: ${{ (github.event_name == 'workflow_dispatch' && inputs.coverage) && 'xdebug' || 'none' }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # These directories are gitignored, so a fresh checkout lacks them and
      # composer's post-autoload-dump (`artisan package:discover`) would abort
      # with "Please provide a valid cache path."
      - name: Create writable directories
        run: |
          mkdir -p bootstrap/cache storage/app storage/framework/cache/data \
            storage/framework/sessions storage/framework/views storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml drives the test environment: sqlite :memory:, array cache/sessions,
      # sync queue and VERTEX_INSTALLED=true, so no database service is needed.
      - name: Run tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage) }}
        run: php artisan test

      # Coverage is opt-in because PHPUnit's report generation currently crashes on
      # the runner (exit 255 inside PHPUnit\Runner\CodeCoverage::generateReports()
      # with xdebug loaded in coverage mode), which would turn every push red.
      # Dispatch the workflow with coverage=true to exercise it; phpunit.xml already
      # declares the <source> block that coverage needs.
      - name: Run tests with coverage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage }}
        run: |
          set +e
          php -d memory_limit=-1 artisan test --coverage --min="$COVERAGE_MIN" 2>&1 | tee coverage.txt
          status=${PIPESTATUS[0]}
          pct=$(grep -oE '[0-9]+([.][0-9]+)?%' coverage.txt | tail -1)
          {
            echo "### Code coverage"
            echo ""
            echo "Measured: ${pct:-unknown}, minimum: ${COVERAGE_MIN}%"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            reason=$(grep -m1 -iE 'error|exception|fatal|failed' coverage.txt | tr -d '\r' | cut -c1-300)
            echo "::error title=Coverage run failed::${reason:-no diagnostic line}"
          fi
          exit $status
        env:
          COVERAGE_MIN: '0'
          XDEBUG_MODE: coverage

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
