name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: artisan test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, fileinfo, bcmath, zip, gd, sqlite3, pdo_sqlite, curl, openssl
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # These directories are gitignored, so a fresh checkout lacks them and
      # composer's post-autoload-dump (`artisan package:discover`) would abort
      # with "Please provide a valid cache path."
      - name: Create writable directories
        run: |
          mkdir -p bootstrap/cache storage/app storage/framework/cache/data \
            storage/framework/sessions storage/framework/views storage/logs

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml drives the test environment: sqlite :memory:, array cache/sessions,
      # sync queue and VERTEX_INSTALLED=true, so no database service is needed.
      - name: Run tests
        run: php artisan test

      # `artisan test` cannot emit a clover report, so a second PHPUnit pass
      # produces the artifact that the threshold check and the upload consume.
      - name: Collect coverage
        id: collect
        run: |
          set +e
          php vendor/bin/phpunit --coverage-clover=coverage.xml > coverage-run.txt 2>&1
          status=$?
          tail -5 coverage-run.txt
          msg=$(grep -m1 -iE "error|warning|exception|driver|permission|fatal|failed|not found" coverage-run.txt | tr -d '\r' | cut -c1-90 | tr -c 'A-Za-z0-9 ._-' '_')
          {
            echo "status=$status"
            echo "msg=${msg:-none}"
          } >> "$GITHUB_OUTPUT"
          if [ ! -s coverage.xml ]; then
            echo "::error title=Coverage::phpunit exited $status without writing coverage.xml: ${msg:-no diagnostic line}"
          fi
          exit $status
        env:
          XDEBUG_MODE: coverage

      # Keeps the phpunit output readable through the artifact name when job logs
      # are not available to the caller.
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ steps.collect.outputs.status }}-${{ steps.collect.outputs.msg }}
          path: coverage-run.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce coverage threshold
        id: coverage
        run: |
          set +e
          php scripts/ci/coverage-check.php coverage.xml "$COVERAGE_MIN" > coverage-summary.txt 2>&1
          status=$?
          cat coverage-summary.txt
          echo "pct=$(tail -1 coverage-summary.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "### Code coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
        env:
          COVERAGE_MIN: '0'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.coverage.outputs.pct }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: npm run build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
