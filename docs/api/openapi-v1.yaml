openapi: 3.1.0
info:
  title: VertexCMS Public API
  version: v1
  description: Public API contract for mobile clients and external integrations.
servers:
  - url: /api/v1
paths:
  /public/pages:
    get:
      summary: List published pages
      responses:
        '200':
          description: Published pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageResponse'
  /public/pages/by-uri:
    get:
      summary: Get a published page by URI
      parameters:
        - in: query
          name: uri
          required: true
          schema:
            type: string
            example: /about
      responses:
        '200':
          description: Published page by URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/menus/{location}:
    get:
      summary: Get active menu by location
      parameters:
        - in: path
          name: location
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /public/settings/site:
    get:
      summary: Get public site settings
      responses:
        '200':
          description: Public settings payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettingsResponse'
components:
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        count:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: '#/components/schemas/ApiMeta'
    Page:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        uri:
          type: string
        status:
          type: string
        template:
          type: string
        content_json:
          type: object
          additionalProperties: true
        custom_fields_json:
          type: array
          items:
            type: object
            additionalProperties: true
        custom_fields:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        seo:
          type: object
          nullable: true
          additionalProperties: true
        parent_uri:
          type: string
          nullable: true
    PageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PaginatedPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        links:
          type: object
          additionalProperties:
            type: string
            nullable: true
        meta:
          allOf:
            - $ref: '#/components/schemas/ApiMeta'
            - type: object
              properties:
                pagination:
                  $ref: '#/components/schemas/PaginationMeta'
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        target:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        parent_id:
          type: integer
          nullable: true
        sort_order:
          type: integer
        settings:
          type: object
          additionalProperties: true
    Menu:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        location:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    MenuResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Menu'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PublicSettings:
      type: object
      properties:
        site:
          type: object
          additionalProperties: true
        seo:
          type: object
          additionalProperties: true
        api:
          type: object
          additionalProperties: true
        pwa:
          type: object
          additionalProperties: true
    PublicSettingsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PublicSettings'
        meta:
          $ref: '#/components/schemas/ApiMeta'
